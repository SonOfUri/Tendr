<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#070707" />
    <title>Tendr — Offline</title>
    <style>
      @font-face {
        font-family: 'Rethink Sans';
        src: url('/fonts/rethink-sans.woff2') format('woff2');
        font-weight: 100 800;
        font-style: normal;
        font-display: swap;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        color: #f5f5f5;
        font-family: 'Rethink Sans', 'Segoe UI', system-ui, sans-serif;
        background:
          linear-gradient(180deg, rgba(0, 0, 0, 0.28), rgba(0, 0, 0, 0.55)),
          url('/onboarding-bg-image.png') center bottom / cover no-repeat,
          #070707;
        background-attachment: fixed;
      }

      .shell {
        width: min(28rem, 100%);
        display: grid;
        justify-items: start;
        gap: 1.35rem;
      }

      .brand {
        display: block;
        line-height: 0;
      }

      .brand img {
        display: block;
        height: 2.15rem;
        width: auto;
      }

      .card {
        display: grid;
        gap: 0.85rem;
        width: 100%;
        padding: 1.5rem 1.45rem;
        border-radius: 24px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(12, 12, 12, 0.78);
        box-shadow: 0 24px 50px rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(16px);
      }

      .eyebrow {
        margin: 0;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #a3a3a3;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.55rem, 4vw, 1.9rem);
        font-weight: 700;
        letter-spacing: -0.04em;
        line-height: 1.15;
        color: #f5f5f5;
      }

      p {
        margin: 0;
        color: #bdbdbd;
        line-height: 1.55;
        font-size: 0.98rem;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.65rem;
        margin-top: 0.35rem;
      }

      button {
        appearance: none;
        border: none;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        font-size: 0.92rem;
        border-radius: 999px;
        padding: 0.75rem 1.2rem;
        color: #0a0a0a;
        background: #f5f5f5;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.28);
        transition:
          transform 0.15s ease,
          filter 0.15s ease;
      }

      button:hover {
        transform: translateY(-1px);
        filter: brightness(1.06);
      }

      button:active {
        transform: translateY(0);
      }

      button:focus-visible {
        outline: 2px solid #f5f5f5;
        outline-offset: 3px;
      }

      .hint {
        font-size: 0.85rem;
        color: #8a8a8a;
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <a class="brand" href="/" aria-label="Tendr home">
        <img src="/logo-with-watermark-white.png" alt="Tendr" />
      </a>

      <section class="card">
        <p class="eyebrow">Connection</p>
        <h1>You’re offline</h1>
        <p>
          Tendr can show the public shell without a network, but payment actions are disabled. No
          payment can succeed while offline.
        </p>
        <div class="actions">
          <button type="button" onclick="location.reload()">Try again</button>
        </div>
        <p class="hint">Reconnect, then retry. Sending a payment link needs a live connection.</p>
      </section>
    </main>
  </body>
</html>
