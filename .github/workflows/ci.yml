name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tendr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tendr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tendr
      NODE_ENV: test
      API_PORT: 4000
      API_HOST: 127.0.0.1
      API_BASE_URL: http://localhost:4000
      WEB_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      LOG_LEVEL: error
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tendr
      REDIS_URL: redis://localhost:6379
      KEYVAULT_DRIVER: local
      LOCAL_KEYVAULT_PATH: .keyvault/ci.json

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: Build packages
        run: |
          npm run build --workspace=@tendr/contracts
          npm run build --workspace=@usetendr/sdk
          npm run build --workspace=@tendr/ui
      - name: Generate Prisma client
        run: npm run db:generate --workspace=@tendr/api
      - name: Verify standalone SDK
        run: |
          npm run check:contracts --workspace=@usetendr/sdk
          npm run check:api-types --workspace=@usetendr/sdk
          npm run test:package --workspace=@usetendr/sdk
      - name: Migrate
        run: npm run db:migrate --workspace=@tendr/api
      - name: Lint
        run: npm run lint --if-present
      - name: Typecheck
        run: |
          npm run typecheck --workspace=@tendr/contracts
          npm run typecheck --workspace=@usetendr/sdk
          npm run typecheck --workspace=@tendr/ui
          npm run typecheck --workspace=@tendr/api
          npm run typecheck --workspace=@tendr/web
      - name: Test
        run: |
          npm run test --workspace=@tendr/contracts
          npm run test --workspace=@usetendr/sdk
          npm run test --workspace=@tendr/api
          npm run test --workspace=@tendr/web
      - name: Build
        run: |
          npm run build --workspace=@tendr/api
          npm run build --workspace=@tendr/web

  e2e:
    # Dashboard end-to-end tests (Playwright, virtual WebAuthn authenticator) against the API and
    # worker with the in-memory NEAR client running the merchant-account contract, and the checkout
    # tests (e2e/checkout.spec.ts: simulated 1Click, test screening list). playwright.config.ts
    # starts every server: API + worker (:4100), web (:3100, tendr.js built for it first), and the
    # fixture store on a second origin (:3200; 127.0.0.1:3200 is the unregistered origin).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tendr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tendr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tendr
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tendr
      REDIS_URL: redis://localhost:6379
      E2E_REDIS_URL: redis://localhost:6379/7
      KEYVAULT_DRIVER: local
      LOCAL_KEYVAULT_PATH: .keyvault/ci-e2e.json
      # Only this job runs the contract simulator.
      NEAR_CLIENT_DRIVER: fake
      NEAR_FAKE_SIMULATE: '1'
      MAIL_DRIVER: log
      LOG_LEVEL: warn

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: Build packages
        run: |
          npm run build --workspace=@tendr/contracts
          npm run build --workspace=@usetendr/sdk
          npm run build --workspace=@tendr/ui
      - name: Generate Prisma client
        run: npm run db:generate --workspace=@tendr/api
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Migrate test database
        run: npm run db:migrate:test --workspace=@tendr/api
      - name: End-to-end tests
        run: npm run test:e2e --workspace=@tendr/web
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7

  woocommerce:
    # The WooCommerce plugin (apps/woocommerce): PHPUnit and PHPCS inside wp-env (Docker, which
    # GitHub's ubuntu runners provide). HTTP is mocked in the tests, so no API is needed.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: Cache wp-env downloads
        # WordPress and WooCommerce zips (pinned in .wp-env.tests.json).
        uses: actions/cache@v4
        with:
          path: ~/.wp-env
          key: wp-env-tests-${{ hashFiles('apps/woocommerce/.wp-env.tests.json', 'package-lock.json') }}
      - name: Start wp-env (tests)
        run: npm run env:start:tests --workspace=@tendr/woocommerce
      - name: PHPUnit
        run: npm run test:php --workspace=@tendr/woocommerce
      - name: PHPCS
        run: npm run lint:php --workspace=@tendr/woocommerce
      - name: Build the plugin zip
        # Writes apps/woocommerce/dist/tendr-pay-with-crypto-<version>.zip and its sha256, and the
        # web app's update-feed manifest (in this throwaway checkout only).
        run: npm run build:zip --workspace=@tendr/woocommerce
      - name: Upload the plugin zip
        uses: actions/upload-artifact@v4
        with:
          name: tendr-pay-with-crypto
          path: |
            apps/woocommerce/dist/*.zip
            apps/woocommerce/dist/*.sha256
          retention-days: 30

  woocommerce-e2e:
    # The plugin end to end (apps/web/e2e/woocommerce.spec.ts): two WordPress + WooCommerce sites in
    # wp-env (:8892, :8893) install the freshly built zip and connect to the e2e API (:4100) and web
    # (:3100) in test mode. WordPress reaches the API through host.docker.internal (wp-env maps it
    # to the Docker host), so the API listens on every interface here. Also runs WordPress.org's
    # Plugin Check on the zip. Its own job, so the main e2e job stays fast.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tendr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tendr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tendr
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tendr
      REDIS_URL: redis://localhost:6379
      E2E_REDIS_URL: redis://localhost:6379/7
      E2E_API_HOST: 0.0.0.0
      KEYVAULT_DRIVER: local
      LOCAL_KEYVAULT_PATH: .keyvault/ci-e2e.json
      NEAR_CLIENT_DRIVER: fake
      NEAR_FAKE_SIMULATE: '1'
      MAIL_DRIVER: log
      LOG_LEVEL: warn

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: Build packages
        run: |
          npm run build --workspace=@tendr/contracts
          npm run build --workspace=@usetendr/sdk
          npm run build --workspace=@tendr/ui
      - name: Generate Prisma client
        run: npm run db:generate --workspace=@tendr/api
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Migrate test database
        run: npm run db:migrate:test --workspace=@tendr/api
      - name: Build the plugin zip
        run: npm run build:zip --workspace=@tendr/woocommerce -- --no-publish
      - name: Cache wp-env downloads
        # WordPress, WooCommerce and Plugin Check zips (pinned in the .wp-env.e2e*.json files).
        uses: actions/cache@v4
        with:
          path: ~/.wp-env
          key: wp-env-e2e-${{ hashFiles('apps/woocommerce/.wp-env.e2e.json', 'apps/woocommerce/.wp-env.e2e-b.json', 'package-lock.json') }}
      - name: Start the WordPress sites
        run: npm run env:start:e2e --workspace=@tendr/woocommerce
      - name: Plugin Check (no errors)
        run: npm run plugin-check --workspace=@tendr/woocommerce
      - name: WooCommerce end-to-end tests
        run: npm run test:e2e:woocommerce --workspace=@tendr/web
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-woocommerce
          path: apps/web/test-results
          retention-days: 7

  onchain:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: onchain
    steps:
      - uses: actions/checkout@v4
      # rustup installs the toolchain and components pinned in onchain/rust-toolchain.toml.
      - name: Install toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: onchain
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Unit tests
        # The sandbox tests need the Wasm builds; they run below.
        run: cargo test --all-features --lib
      # Docker is available on GitHub's ubuntu runners; build.sh runs the
      # pinned cargo-near image, the same way release builds are made.
      - name: Build Wasm
        run: |
          scripts/build.sh
          scripts/build.sh --features testnet-admin merchant-account
      - name: Sandbox tests
        run: cargo test -p merchant-account --test sandbox

  onchain-evm:
    # TendrForwarder (onchain/evm). Foundry runs only through onchain/scripts/forge.sh, which
    # starts the pinned Foundry Docker image (Docker is available on GitHub's ubuntu runners).
    # The workflow has no path filters, so this runs on every push and pull request.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check out the Solidity dependencies
        # Only the two pinned submodules; their own nested submodules are not needed.
        run: git submodule update --init --depth 1 onchain/evm/lib/openzeppelin-contracts onchain/evm/lib/forge-std
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Format
        run: onchain/scripts/forge.sh fmt --check
      - name: Tests
        run: onchain/scripts/forge.sh test
      - name: Gas snapshot
        run: onchain/scripts/forge.sh snapshot --check
      - name: TypeScript ABI is up to date
        run: onchain/scripts/forwarder-abi.sh --check
