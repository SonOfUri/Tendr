name: CI

on:
  push:
    branches: [main, master]
  pull_request:

defaults:
  run:
    working-directory: Tendr

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tendr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tendr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tendr
      NODE_ENV: test
      API_PORT: 4000
      API_HOST: 127.0.0.1
      API_BASE_URL: http://localhost:4000
      WEB_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      LOG_LEVEL: error
      CHECKOUT_LIVE_ENABLED: "false"
      PAYMENT_PROVIDER: sandbox
      WEBHOOK_SIGNING_SECRET: ci-test-secret

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: Tendr/.nvmrc
          cache: npm
          cache-dependency-path: Tendr/package-lock.json
      - name: Install
        run: npm ci
      - name: Build packages
        run: |
          npm run build --workspace=@tendr/contracts
          npm run build --workspace=@tendr/sdk
          npm run build --workspace=@tendr/ui
      - name: Generate Prisma client
        run: npm run db:generate --workspace=@tendr/api
      - name: Migrate
        run: npm run db:migrate --workspace=@tendr/api
      - name: Lint
        run: npm run lint --if-present
      - name: Typecheck
        run: |
          npm run typecheck --workspace=@tendr/contracts
          npm run typecheck --workspace=@tendr/sdk
          npm run typecheck --workspace=@tendr/ui
          npm run typecheck --workspace=@tendr/api
          npm run typecheck --workspace=@tendr/web
      - name: Test
        run: |
          npm run test --workspace=@tendr/contracts
          npm run test --workspace=@tendr/sdk
          npm run test --workspace=@tendr/api
      - name: Build
        run: |
          npm run build --workspace=@tendr/api
          npm run build --workspace=@tendr/web
