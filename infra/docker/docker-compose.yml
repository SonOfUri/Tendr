services:
  postgres:
    image: postgres:16-alpine
    container_name: tendr-postgres
    restart: unless-stopped
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tendr
    volumes:
      - tendr_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tendr"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tendr-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - tendr_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # NOTE: MinIO's image is no longer pullable, so this service may not start. Use the GCS dev
  # bucket instead (the GCS block in .env.example: tendr-assets-dev).
  # Theme asset storage (S3-compatible). The API writes with the root credentials; the bucket is
  # publicly readable, served at http://localhost:9100/tendr-assets (TENDR_ASSET_ORIGIN).
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: tendr-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9100:9000"
      - "9101:9001"
    environment:
      MINIO_ROOT_USER: tendr-minio
      MINIO_ROOT_PASSWORD: tendr-minio-secret
    volumes:
      - tendr_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the tendr-assets bucket with anonymous download, then exits.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: tendr-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: tendr-minio
      MINIO_ROOT_PASSWORD: tendr-minio-secret
      MINIO_BUCKET: tendr-assets
    volumes:
      - ./minio-init.sh:/minio-init.sh:ro
    entrypoint: ["/bin/sh", "/minio-init.sh"]
    restart: "no"

volumes:
  tendr_pg_data:
  tendr_redis_data:
  tendr_minio_data:
