name: tendr-wordpress

x-wordpress-env: &wordpress-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_NAME: tendr_store
  WORDPRESS_DB_USER: tendr_store
  WORDPRESS_DB_PASSWORD: ${WPSTORE_DB_PASSWORD:?Run npm run dev:wordpress first}
  WORDPRESS_CONFIG_EXTRA: |
    define('WP_MEMORY_LIMIT', '256M');
    define('WP_MAX_MEMORY_LIMIT', '512M');
    define('WP_ENVIRONMENT_TYPE', 'staging');
    define('DISALLOW_FILE_EDIT', true);

services:
  db:
    image: mariadb:lts
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: tendr_store
      MARIADB_USER: tendr_store
      MARIADB_PASSWORD: ${WPSTORE_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${WPSTORE_DB_ROOT_PASSWORD}
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 30

  wordpress:
    image: wordpress:7.1.3-php8.3-apache
    restart: unless-stopped
    ports:
      - '127.0.0.1:8894:80'
    environment: *wordpress-env
    volumes:
      - wordpress:/var/www/html
      - ./wordpress-store/fashion-theme:/var/www/html/wp-content/themes/tendr-fashion:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'test -s /var/www/html/wp-config.php && curl -fsS http://localhost/wp-login.php >/dev/null',
        ]
      interval: 5s
      timeout: 5s
      retries: 30

  cli:
    image: wordpress:cli-php8.3
    profiles: ['tools']
    user: '33:33'
    environment:
      <<: *wordpress-env
      HOME: /tmp
    volumes:
      - wordpress:/var/www/html
      - ../../apps/woocommerce/dist:/opt/tendr-dist:ro
      - ./wordpress-store/setup.php:/opt/tendr-setup.php:ro
      - ./wordpress-store/wp-cli.yml:/var/www/html/wp-cli.yml:ro
      - ./wordpress-store/fashion-theme:/var/www/html/wp-content/themes/tendr-fashion:ro
      - ./wordpress-store/fashion-setup.php:/opt/tendr-fashion-setup.php:ro
    depends_on:
      wordpress:
        condition: service_healthy

volumes:
  database:
  wordpress:
