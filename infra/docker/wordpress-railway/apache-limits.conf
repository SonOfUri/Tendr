<IfModule mpm_prefork_module>
    StartServers 2
    MinSpareServers 2
    MaxSpareServers 4
    ServerLimit 8
    MaxRequestWorkers 8
    MaxConnectionsPerChild 1000
</IfModule>

# Railway's healthcheck path accepts an alphanumeric route; serve the PHP liveness file here.
Alias /health /var/www/html/railway-health.php
