name: tendr-shopify
services:
  connector:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.shopify
    init: true
    restart: unless-stopped
    ports:
      - '127.0.0.1:3355:3355'
    environment:
      NODE_ENV: production
      SHOPIFY_SIMULATOR: 'true'
      SHOPIFY_APP_URL: http://localhost:3355
      SHOPIFY_STORAGE_KEY: ${TENDR_SHOPIFY_SIMULATOR_STORAGE_KEY:?Run npm run dev:shopify first}
      SHOPIFY_DATABASE: /data/shopify.sqlite
      PORT: '3355'
    volumes:
      - connector:/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3355/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true
volumes:
  connector:
