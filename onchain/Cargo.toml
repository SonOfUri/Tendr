[workspace]
resolver = "3"
members = ["merchant-account", "mock-intents", "integrator-near"]

[workspace.package]
edition = "2021"
rust-version = "1.93"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# near-sdk pinned to the 5.29 minor (MSRV 1.93).
near-sdk = "~5.29.1"
p256 = { version = "0.13", default-features = false }
ed25519-dalek = { version = "2.2", default-features = false, features = ["std"] }

# near/intents rev d340060afe1debb8c8f2f2fc6b6c999d48c886b0
# Upstream crate: `crates/signatures/webauthn` (package `defuse-webauthn`).
# Its checks are vendored into merchant-account/src/webauthn.rs rather than
# depended on: that rev requires Rust 1.97 (`cfg_select!`) and a pre-release
# p256, and its `bool` API checks neither the rpIdHash nor the origin.

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
