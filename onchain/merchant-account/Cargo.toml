[package]
name = "merchant-account"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Testnet-only admin escape hatch (Task 5). Never enabled for live builds.
testnet-admin = []
# Adds the `probe_p256` view, used only by the mainnet verification script
# (apps/api/scripts/verify-merchant-account-mainnet.ts) to prove the
# `p256_verify` host function works on mainnet. Never enabled for a build that
# is published or deployed for a merchant.
probe = []

[dependencies]
near-sdk.workspace = true
# Field arithmetic only, to reject P-256 signer keys that are not curve points
# (nearcore has no host function for it). Signatures are still verified by the
# `p256_verify` host function.
p256 = { workspace = true, features = ["arithmetic"] }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
# Only used to sign test fixtures; verification always goes through the
# `p256_verify` / `ed25519_verify` host functions.
p256 = { workspace = true, features = ["ecdsa", "std"] }
ed25519-dalek.workspace = true
# Sandbox integration tests (tests/sandbox.rs). near-workspaces has no helper
# for global contracts, so those transactions are built with the same
# near-primitives / near-crypto / near-jsonrpc-client versions it uses.
near-workspaces = "0.23.0"
near-sandbox = "0.3.16"
serde_json = "1"
near-primitives = "0.37"
near-crypto = "0.37"
near-jsonrpc-client = "0.22"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow = "1"

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.21.1-rust-1.93.0"
image_digest = "sha256:79b789c81ba19ec30794a6b1046b02dcaf5c055994b22cc7c9af67ab5096b095"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]
