[package]
name = "merchant-account"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Testnet-only admin escape hatch (Task 5). Never enabled for live builds.
testnet-admin = []

[dependencies]
near-sdk.workspace = true

# Native-only signature verification (unit tests). Contract builds use the
# `p256_verify` / `ed25519_verify` host functions instead.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
p256.workspace = true
ed25519-dalek.workspace = true

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.21.1-rust-1.93.0"
image_digest = "sha256:79b789c81ba19ec30794a6b1046b02dcaf5c055994b22cc7c9af67ab5096b095"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]
